<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>سؤال مهم ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Arial", sans-serif;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }

        #yes {
            background-color: #4CAF50;
            color: white;
        }

        #no {
            background-color: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>هتشيلي البلوك ؟ </h1>
        <button id="yes" onclick="yesClick()">Yes 😍</button>
        <button id="no">No 🙈</button>
    </div>

    <script>
        const noBtn = document.getElementById("no");

        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        function yesClick() {
            document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:30px;
                color:white;
                background:linear-gradient(135deg,#ff4d6d,#ff758f);
                text-align:center;
            ">
                ❤️ حقك عليا
            </div>
        `;
        }
    </script>

</body>

</html>
